name: Refresh transit data

# The upstream GTFS feed and BMRCL's parking page change occasionally. This
# re-runs the pipeline weekly and commits only when something actually changed,
# which triggers a Vercel deploy and regenerates the static pages.
on:
  schedule:
    - cron: '0 20 * * 0'   # Mondays 01:30 IST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The pipeline asserts its own output (station count, parking matching,
      # weekday/sunday divergence), so a bad upstream feed fails here rather
      # than silently shipping wrong timetables.
      - name: Rebuild data
        run: npm run build:data

      - name: Verify logic still passes against the new data
        run: npm run test:tz

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh BMRCL timetables and parking"
          git push
