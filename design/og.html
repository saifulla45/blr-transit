<!doctype html>
<!--
  Source for public/og.png — the card WhatsApp, Slack and Twitter render when
  someone shares a link.

  Rendered to PNG rather than generated with next/og ImageResponse: that needs
  a runtime to render on request, and this site is a static export with no
  server. A committed PNG also means the preview cannot silently break in
  production.

  Re-render after editing (needs the `browse` CLI — a local tool, deliberately
  not a build dependency, since the PNG is committed and the build never needs
  to regenerate it):

    browse viewport 1200x630
    browse goto file://$PWD/design/og.html
    browse screenshot public/og.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    background: #0b0710;
    color: #f4f0f8;
    font-family: Barlow, system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Same violet light sources as the landing hero, so a shared link looks
     like the page it opens. */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .glow-a { width: 640px; height: 640px; top: -260px; left: -160px;
            background: radial-gradient(circle, rgba(170,60,200,.42), transparent 70%); }
  .glow-b { width: 540px; height: 540px; bottom: -220px; right: -120px;
            background: radial-gradient(circle, rgba(88,40,180,.38), transparent 70%); }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 100%);
  }

  .content { position: relative; z-index: 1; }

  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 76px; height: 76px; }
  .brand span { font-size: 34px; font-weight: 600; letter-spacing: -.01em; }

  h1 {
    margin-top: 38px;
    font-size: 82px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -.028em;
    max-width: 16ch;
    background: linear-gradient(170deg, #fff 30%, #d79bea 76%, #a855c9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.sub { margin-top: 22px; font-size: 29px; color: #9b90ad; max-width: 40ch; line-height: 1.35; }

  .stats { position: relative; z-index: 1; display: flex; gap: 56px; }
  .stat .n { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .stat .l { font-size: 18px; color: #9b90ad; text-transform: uppercase;
             letter-spacing: .09em; font-weight: 600; margin-top: 4px; }

  /* The three line colours as a rule along the bottom — the network's own
     identity rather than a generic accent bar. */
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; display: flex; }
  .rule i { flex: 1; }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="grid"></div>

  <div class="content">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="11" fill="#0b0710"/>
        <g transform="rotate(-90 24 24)" stroke-width="5.6" stroke-linecap="round" fill="none">
          <circle cx="24" cy="24" r="16.6" stroke-dasharray="28.9 75.4" stroke="#c264d8" stroke-dashoffset="0"/>
          <circle cx="24" cy="24" r="16.6" stroke-dasharray="28.9 75.4" stroke="#45cf78" stroke-dashoffset="-34.75"/>
          <circle cx="24" cy="24" r="16.6" stroke-dasharray="28.9 75.4" stroke="#e8c552" stroke-dashoffset="-69.5"/>
        </g>
        <g fill="#ffffff">
          <circle cx="24" cy="17.1" r="3.5"/>
          <path d="M16.9 29.6c0-3.9 3.2-7.1 7.1-7.1s7.1 3.2 7.1 7.1z"/>
          <rect x="13.2" y="31.4" width="21.6" height="3.3" rx="1.65"/>
        </g>
      </svg>
      <span>Namma Commute</span>
    </div>

    <h1>Your nearest metro, in one tap</h1>
    <p class="sub">Scheduled trains, fares, parking, buses and what&rsquo;s around every Bengaluru station.</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="n">83</div><div class="l">Stations</div></div>
    <div class="stat"><div class="n">3</div><div class="l">Lines</div></div>
    <div class="stat"><div class="n">2,800+</div><div class="l">Nearby places</div></div>
    <div class="stat"><div class="n">Free</div><div class="l">No ads, no signup</div></div>
  </div>

  <div class="rule">
    <i style="background:#c264d8"></i>
    <i style="background:#45cf78"></i>
    <i style="background:#e8c552"></i>
  </div>
</body>
</html>
