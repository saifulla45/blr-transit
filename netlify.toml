# Used when the site is connected to a git repo. The drag-and-drop deploy
# ignores this file — it only matters once you point Netlify at the repository,
# which is the setup you want long term.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached, or a stale copy keeps serving old
# assets after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Transit JSON changes only when the weekly pipeline runs; revalidate often
# enough that a refresh reaches people, cheaply enough to stay fast.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Next fingerprints these, so they can be cached hard.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The share card and hero are content, not code, so Next does not fingerprint
# them. A week is long enough to be worth caching and short enough that
# replacing either reaches people without renaming the file.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Defence in depth for a site with no login and no user input: these cost
# nothing on a static host and close off clickjacking and MIME sniffing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=()"
